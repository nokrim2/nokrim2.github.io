<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>명일방주: 엔드필드</title>
<style>
  :root { color-scheme: dark; }
  body { font: 15px/1.6 'Malgun Gothic', 'Segoe UI', sans-serif;
         background: #1b1d22; color: #ddd; margin: 0;
         min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  main { width: min(560px, 90vw); }
  h1 { font-size: 22px; color: #8ab4f8; margin: 0 0 4px; }
  .sub { color: #888; margin: 0 0 24px; font-size: 13px; }
  a.card { display: block; background: #23252b; border: 1px solid #3a3d45;
           border-radius: 8px; padding: 14px 18px; margin: 10px 0;
           color: #ddd; text-decoration: none; }
  a.card:hover { border-color: #8ab4f8; background: #2a2d33; }
  a.card .t { font-weight: 600; }
  a.card .d { color: #888; font-size: 12px; margin-top: 2px; }
  a.card.soon { opacity: .45; cursor: default; }
  a.card.soon:hover { border-color: #3a3d45; background: #23252b; }
</style>
</head>
<body>
<main>
  <h1>nokrim2.github.io</h1>
  <p class="sub">명일방주: 엔드필드 데이터 도구</p>

  <a class="card" href="./calc/">
    <div class="t">데미지 계산기</div>
    <div class="d">캐릭터/무기/장비/버프 기반 스킬 데미지 계산 — 게임 데이터 재구성 공식</div>
  </a>

  <a class="card" href="./orbipom/">
    <div class="t">융합! 버블!</div>
    <div class="d">융합! 버블! 웹 이벤트</div>
  </a>

  <a class="card" href="./rhythm/" style="opacity:.8">
    <div class="t">주크박스</div>
    <div class="d">(이상한 주크박스가 있다. 연주해 볼까?)</div>
  </a>

  <!-- 여기에 새 도구 카드 추가
  <a class="card" href="./도구경로/">
    <div class="t">도구 이름</div>
    <div class="d">설명</div>
  </a>
  -->
  <div class="card soon">
    <div class="t">추가 예정</div>
  </div>
</main>
</body>
</html>
